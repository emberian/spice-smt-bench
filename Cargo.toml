[package]
name = "spice2smt"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Zero-dependency SPICE netlist, PCB multiphysics, and semiconductor model compiler to Transcendental + ODE SMT-LIB2 (ALL / QF_NRA_ODE) and Lean 4 target specifications"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["smt", "spice", "formal-verification", "pcb", "tcad"]
categories = ["science", "compilers", "simulation"]

[dependencies]

[[bin]]
name = "spice2smt"
path = "src/main.rs"
